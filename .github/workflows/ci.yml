name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter liste les fichiers de la PR via l'API

jobs:
  # Monorepo : chaque job ne tourne que si sa zone a changé. On filtre au niveau des
  # jobs (et non via `on.paths`) : un job sauté compte comme réussi pour les checks
  # obligatoires, un workflow non déclenché resterait « en attente ».
  changes:
    name: Zones modifiées
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'content/**'
              - 'Dockerfile'
              - 'railway.json'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'packages/shared/**'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend (pytest)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  frontend:
    name: Frontend (lint + build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # fr.json / en.json sont générés depuis src/locales/parts : doivent être à jour.
      - name: Traductions fusionnées à jour
        run: |
          node scripts/merge-locales.mjs
          git diff --exit-code -- src/locales/fr.json src/locales/en.json
      - run: npm run lint
      - run: npm run build
