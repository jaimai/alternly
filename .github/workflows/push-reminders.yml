# Rappel push la veille d'une passation (app mobile). Séparé de cron.yml : il doit
# partir le soir, pas le matin.
# Secrets : les mêmes que cron.yml (CRON_URL = …/api/cron/exchange-reminders, CRON_SECRET).
name: Push reminders

on:
  schedule:
    - cron: "7 17 * * *" # 17:07 UTC = 19:07 à Paris l'été, 18:07 l'hiver
  workflow_dispatch:

jobs:
  handover-reminders:
    name: Rappels de passation (push)
    runs-on: ubuntu-latest
    environment: "alternly / production"
    timeout-minutes: 10
    steps:
      - name: POST /api/cron/handover-reminders
        env:
          CRON_URL: ${{ secrets.CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Secrets CRON_URL / CRON_SECRET manquants"
            exit 1
          fi
          URL="${CRON_URL%/exchange-reminders}/handover-reminders"
          # Envois journalisés (email_log) : les retries sont sans risque.
          status=$(curl --silent --show-error --output response.txt --write-out '%{http_code}' \
            --retry 3 --retry-delay 20 --retry-all-errors --max-time 120 \
            -X POST -H "X-Cron-Key: $CRON_SECRET" "$URL")
          cat response.txt; echo
          case "$status" in
            2??) echo "OK ($status)" ;;
            *) echo "::error::Réponse HTTP $status"; exit 1 ;;
          esac
