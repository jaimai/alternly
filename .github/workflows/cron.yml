# Tâches planifiées de l'API (pas de scheduler interne au backend).
# Secrets du dépôt requis :
#   CRON_URL    = https://<api>/api/cron/exchange-reminders
#                 (les autres tâches sont déduites : même base, autre suffixe)
#   CRON_SECRET = même valeur que la variable CRON_SECRET côté Railway
# (en-tête X-Cron-Key attendu par backend/app/routers/cron.py)
name: Cron

on:
  schedule:
    - cron: "7 6 * * *" # tous les jours à 06:07 UTC
  workflow_dispatch:

jobs:
  exchange-reminders:
    name: Rappels d'échange de garde
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /api/cron/exchange-reminders
        env:
          CRON_URL: ${{ secrets.CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Secrets CRON_URL / CRON_SECRET manquants"
            exit 1
          fi
          # Rappels idempotents côté API (reminder_sent_at) : les retries sont sans risque.
          status=$(curl --silent --show-error --output response.txt --write-out '%{http_code}' \
            --retry 3 --retry-delay 20 --retry-all-errors --max-time 60 \
            -X POST -H "X-Cron-Key: $CRON_SECRET" "$CRON_URL")
          cat response.txt; echo
          case "$status" in
            2??) echo "OK ($status)" ;;
            *) echo "::error::Réponse HTTP $status"; exit 1 ;;
          esac

  invite-reminders:
    name: Relances d'invitation du coparent
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /api/cron/invite-reminders
        env:
          CRON_URL: ${{ secrets.CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Secrets CRON_URL / CRON_SECRET manquants"
            exit 1
          fi
          URL="${CRON_URL%/exchange-reminders}/invite-reminders"
          # Relances horodatées côté API : les retries sont sans risque.
          status=$(curl --silent --show-error --output response.txt --write-out '%{http_code}' \
            --retry 3 --retry-delay 20 --retry-all-errors --max-time 60 \
            -X POST -H "X-Cron-Key: $CRON_SECRET" "$URL")
          cat response.txt; echo
          case "$status" in
            2??) echo "OK ($status)" ;;
            *) echo "::error::Réponse HTTP $status"; exit 1 ;;
          esac
