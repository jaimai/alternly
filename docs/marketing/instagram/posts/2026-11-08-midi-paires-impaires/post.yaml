legende: |
  Années paires et impaires en garde alternée : enfin compris 🧮

  « La première moitié des vacances les années paires… » C'est la formule la plus courante des jugements, et la première source de malentendus. L'astuce pour Noël : c'est l'année du début des vacances qui compte.

  Cette année, tu as la 1re ou la 2e moitié ? Réponds 1 ou 2 👇

  📌 Enregistre, tu en auras besoin à chaque vacances. Notre outil gratuit calcule les dates pour vous : lien en bio.
