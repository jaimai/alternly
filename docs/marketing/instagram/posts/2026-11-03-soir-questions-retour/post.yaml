legende: |
  Le retour de chez l'autre parent, c'est un moment fragile pour l'enfant 🎒

  Les questions « innocentes » le mettent souvent en position de choisir ou de rapporter. Ce qui l'aide : se sentir accueilli, sans enquête, et avoir le droit d'aimer ses deux maisons.

  Quelle phrase tu dis à ton enfant quand il revient ? Partage-la en commentaire, ça aidera d'autres parents 👇

  📌 Enregistre pour le prochain retour.
