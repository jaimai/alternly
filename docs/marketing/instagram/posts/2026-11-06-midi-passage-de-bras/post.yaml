legende: |
  La checklist du passage de bras serein en garde alternée 🤝

  Jour et heure fixes, l'école comme lieu de passage, des doublons pour alléger le sac, un petit rituel, et entre adultes : bref et cordial. Ce moment compte énormément pour l'enfant.

  Chez vous, le passage se fait où ? 🏫 école, 🏠 maison ou 🌳 lieu neutre ? 👇

  📌 Enregistre avant dimanche. L'article complet est en lien en bio.
