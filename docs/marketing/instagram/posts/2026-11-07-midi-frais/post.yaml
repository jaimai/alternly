legende: |
  Garde alternée : qui paie quoi ? 🧾

  Frais ordinaires, scolaires, santé non remboursée, exceptionnels : chaque catégorie a sa règle habituelle. Les disputes viennent presque toujours d'une catégorie qui n'a jamais été écrite noir sur blanc.

  Chez vous, la dépense qui crée le plus de débats : 🍽️ cantine, 👓 santé ou ⚽ activités ? 👇

