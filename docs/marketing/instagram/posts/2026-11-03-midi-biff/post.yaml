legende: |
  Méthode BIFF : comment répondre à son ex sans dispute 💬

  Bref, Informatif, aimable (Friendly), Ferme. C'est une méthode très utilisée en médiation familiale pour garder une communication apaisée, et elle protège surtout les enfants.

  Le message le plus dur à écrire pour toi, c'est lequel ? 1️⃣ changer le planning, 2️⃣ l'argent, 3️⃣ les vacances

  📌 Enregistre et garde-le sous la main. Toutes nos méthodes pour communiquer sans conflit : lien en bio.
