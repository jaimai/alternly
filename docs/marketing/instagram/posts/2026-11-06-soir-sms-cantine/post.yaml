legende: |
  « Tu me dois 37 € de cantine. » « Et mes lunettes alors ? » 💸

  Les comptes par SMS finissent toujours en « on est quittes » qui ne convainc personne. Ce qui apaise : une seule liste partagée, avec le ticket à chaque fois, et un solde que les deux voient.

  C'est quelle dépense qui crée le plus de débats chez vous ? 👇

  Dans Alternly, les dépenses partagées se suivent au même endroit que le calendrier. Gratuit pour commencer, lien en bio.
