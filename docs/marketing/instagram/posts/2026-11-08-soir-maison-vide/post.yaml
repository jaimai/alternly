  Pour le parent qui rentre dans une maison vide ce soir 🌙

  Le silence, la chambre rangée trop tôt, le petit pincement. C'est normal, et ça ne veut pas dire que tu fais mal les choses. Ton enfant est avec son autre parent, et ce temps-là peut aussi être pour toi.

  Toi, c'est quoi ton rituel du dimanche soir sans les enfants ? 👇

  💛 Partage à un parent qui vit ça ce soir.
