legende: |
  Le sac du dimanche soir, ce grand mystère 🎒😅

  Doudou, cahier, médicaments… et toujours une chaussette orpheline. L'astuce qui change tout : des doublons dans chaque maison (brosse à dents, pyjama, chargeur). Le sac ne transporte plus que l'essentiel.

  Et toi, c'est quoi l'objet le plus improbable que tu as retrouvé dans le sac ? 👇

  📌 Enregistre avant le prochain passage de bras.
