legende: |
  Mercredi 11 novembre : qui a les enfants en garde alternée ? 📅

  En général, les jours fériés hors vacances suivent le rythme habituel : c'est le parent qui a les enfants ce jour-là qui les garde. Sauf si votre jugement ou votre convention prévoit autre chose pour les fériés et les ponts.

  Chez vous, les fériés c'est 🔁 rythme habituel ou ✍️ règle à part ? 👇

  Envoie-le à l'autre parent avant mercredi.
