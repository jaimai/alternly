legende: |
  Le SMS de dernière minute de l'autre parent… on a tous eu envie de répondre la version 1 😅

  La version 2, c'est la méthode BIFF : bref, informatif, aimable, ferme. Pas de reproche, des faits, une question fermée. La discussion s'arrête là, et les enfants ne sentent pas la tension.

  Toi, tu réponds plutôt version 1 ou version 2 ? (on ne juge pas 🙈)

  📌 Enregistre pour la prochaine fois.
