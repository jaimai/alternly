legende: |
  Ce que les enfants de parents séparés aimeraient vous dire 💛

  Ils le disent rarement avec des mots. Mais on le voit dans un sac qu'ils ne veulent pas défaire, une question qu'ils évitent, un silence au moment du passage de bras.

  Laquelle te touche le plus ? Réponds avec le numéro de la slide 👇

  Partage à un parent qui a besoin de l'entendre aujourd'hui.
