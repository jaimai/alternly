legende: |
  Noël 2026 en garde alternée : qui a les enfants ? 🎄

  Vacances de Noël du 19 décembre 2026 au 4 janvier 2027, toutes zones. Avec la règle classique « la moitié des vacances, années paires / impaires », le parent qui a la 1re moitié les années paires passe Noël avec les enfants (19 → 26 décembre). L'autre a le Nouvel An.

  Et chez vous, comment vous faites ?
  🎅 On alterne chaque année
  🥂 On coupe le 25 à midi
  🏠 On le fête ensemble
  Réponds avec l'emoji 👇

  📌 Enregistre pour ne pas te tromper de dates. Le guide complet (avec checklist) est en lien en bio.
